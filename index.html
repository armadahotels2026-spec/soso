.top h1{font-size:15px;line-height:1.25}.top h1 small{display:block;font-size:11px;opacity:.75;font-weight:400}
.top .sp{flex:1}.ukb{display:flex;flex:none}.top h1{white-space:nowrap}.ib{white-space:nowrap}.top h1 .ttl{display:block;font-size:9px;letter-spacing:2.5px;color:#1F4E9C;opacity:.8;font-weight:700;font-style:italic}
.stripe{background:#1F4E9C}.ib{background:#EEF3FB;border:1px solid #CFDCEF;color:#1F4E9C;font-weight:700;border-radius:8px;padding:5px 10px;font-size:13px}
.timer{font:700 16px 'IBM Plex Sans';background:rgba(255,255,255,.14);padding:4px 10px;border-radius:8px;direction:ltr}.timer.low{background:#D7141A}
.stripe{height:3px;display:flex;opacity:.9}.stripe i{flex:1}.stripe i:nth-child(1){background:var(--c1)}.stripe i:nth-child(2){background:var(--c2)}.stripe i:nth-child(3){background:var(--c3)}.stripe i:nth-child(4){background:var(--c4)}
.wrap{max-width:860px;margin:0 auto;padding:16px 16px 40px}
nav.tabs{background:var(--card);border-bottom:1px solid var(--line);box-shadow:0 2px 8px rgba(36,27,20,.08)}
.tabs .in{max-width:860px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tabs button{border:0;background:none;padding:7px 2px 6px;font-size:11.5px;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:1px;border-bottom:3px solid transparent}
.tabs button svg{width:22px;height:22px}[dir=ltr] .row,[dir=ltr] .mod,[dir=ltr] .hzc,[dir=ltr] .cat{text-align:left}[dir=ltr] .row.big{border-right:1px solid var(--line);border-left:5px solid var(--red)}[dir=ltr] .fb{border-right:0;border-left:5px solid var(--ok)}[dir=ltr] .fb.no{border-left-color:var(--bad)}[dir=ltr] .mod svg.ic{left:auto;right:12px}[dir=ltr] .hzc{padding:10px 40px 10px 10px}[dir=ltr] .hzc .sc{left:auto;right:8px}[dir=ltr] .ba{border-right:0;border-left:4px solid var(--ok)}
.bi{display:none!important}.tabs .ti{font-style:normal;font-size:9.5px;opacity:.7;line-height:1}.mod .mi{font-style:normal;font-size:12px;opacity:.85;margin-top:-4px}.streak i{font-style:normal;font-size:10.5px;opacity:.8}.tabs button.on{color:var(--ink);font-weight:700;border-bottom-color:var(--gold)}.tabs button.on svg{color:var(--gold)}
h2.pt{font-size:22px;line-height:1.3;margin:4px 0 2px}.sub{color:var(--mut);font-size:14px}
.kit{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:14px}
.mod{border:0;border-radius:18px;box-shadow:0 8px 18px rgba(36,27,20,.18);padding:16px;color:#fff;text-align:right;display:flex;flex-direction:column;gap:4px;min-height:132px;position:relative;overflow:hidden}
.mod b{font-size:17px}.mod span{font-size:12.5px;opacity:.9}.mod .pc{margin-top:auto;font:700 13px 'IBM Plex Sans';display:flex;align-items:center;gap:8px}
.mod .pc i{flex:1;height:5px;background:rgba(255,255,255,.3);border-radius:4px;overflow:hidden;display:block}.mod .pc i em{display:block;height:100%;background:#fff}
.mod svg.ic{position:absolute;left:12px;top:12px;width:34px;height:34px;opacity:.9}
.m1{background:linear-gradient(135deg,#1F4E9C,#2F73D9)}.m2{background:linear-gradient(135deg,#9C2A5E,#C9417F)}.m3{background:linear-gradient(135deg,#0F6C77,#1597A6)}.m4{background:linear-gradient(135deg,#3F3A93,#6157C9)}
.ready{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin-top:12px;display:flex;align-items:center;gap:14px}
.gauge{width:76px;height:76px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center}.gauge div{width:60px;height:60px;border-radius:50%;background:var(--card);display:flex;align-items:center;justify-content:center;font:700 17px 'IBM Plex Sans'}
.ready b{font-size:15px}.ready p{font-size:13px;color:var(--mut)}
.sec-t{font-size:15px;font-weight:700;margin:20px 0 8px}
.list{display:grid;gap:8px}
.row{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;align-items:center;gap:12px;text-align:right;width:100%}
.row .t{flex:1}.row .t b{display:block;font-size:15px}.row .t small{color:var(--mut);font-size:12.5px}
.row .badge{font:700 12px 'IBM Plex Sans';color:var(--mut)}.row .dot{width:10px;height:10px;border-radius:50%;flex:none}
.row.big{border-right:5px solid var(--red)}
.tgl{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:6px 14px;font-size:13px;width:max-content;margin-top:10px}
.tgl input{accent-color:var(--red)}
.qbar{display:flex;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.prog{flex:1;min-width:120px;height:6px;background:var(--line);border-radius:6px;overflow:hidden}.prog i{display:block;height:100%;background:linear-gradient(90deg,#1F4E9C,#2F73D9)}
.qcard{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px}
.qmeta{display:flex;justify-content:space-between;gap:8px;font-size:12.5px;color:var(--mut);margin-bottom:8px}
.badge2{background:var(--chip);border-radius:20px;padding:2px 10px}
.qen{font-size:18.5px;font-weight:600;line-height:1.5;text-align:left}
.qar{font-size:15.5px;font-weight:600;margin-top:8px}
.multi{display:inline-block;background:var(--red);color:#fff;border-radius:20px;padding:1px 10px;font-size:12px;margin-top:8px}
.ans{display:grid;gap:8px;margin-top:14px;direction:ltr}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--card);border:2px solid var(--line);border-radius:12px;padding:11px 14px;font-size:16px;min-height:52px}
.opt .L{width:30px;height:30px;border-radius:50%;background:var(--chip);display:flex;align-items:center;justify-content:center;font:700 14px 'IBM Plex Sans';flex:none}
.opt.sel{border-color:var(--gold);background:var(--chip)}.opt.sel .L{background:var(--gold);color:#fff}
.opt.ok{border-color:var(--ok);background:var(--okbg)}.opt.ok .L{background:var(--ok);color:#fff}
.opt.bad{border-color:var(--bad);background:var(--badbg)}.opt.bad .L{background:var(--bad);color:#fff}
.fb{margin-top:14px;border-radius:12px;padding:12px 14px;border-right:5px solid var(--ok);background:var(--okbg)}.fb.no{border-right-color:var(--bad);background:var(--badbg)}
.fb b{display:block}.fb p{font-size:14px;margin-top:4px}
.kw{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.kw span{background:var(--chip);border-radius:20px;padding:2px 10px;font-size:12.5px}
.nav{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.btn{background:#1F4E9C;color:#FFFFFF;border:0;border-radius:10px;padding:11px 18px;font-weight:600;font-size:15px}
.btn.red{background:linear-gradient(180deg,#2F73D9,#1F4E9C);color:#FFFFFF;box-shadow:0 6px 14px rgba(31,78,156,.25)}.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}.btn:disabled{opacity:.45;cursor:default}
.flag.on{background:var(--gold);color:#14202F;border-color:var(--gold)}
.pal{display:grid;grid-template-columns:repeat(10,1fr);gap:6px;margin-top:14px;direction:ltr}
.pal button{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:6px 0;font:13px 'IBM Plex Sans';position:relative}
.pal button.done{background:var(--chip);border-color:var(--blue2)}.pal button.cur{outline:2px solid var(--red)}
.pal button.fl:after{content:"";position:absolute;top:3px;right:3px;width:7px;height:7px;border-radius:50%;background:var(--gold)}
.res{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;text-align:center}
.ring{width:150px;height:150px;border-radius:50%;margin:6px auto;display:flex;align-items:center;justify-content:center}
.ring div{width:118px;height:118px;border-radius:50%;background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring b{font:700 32px 'IBM Plex Sans';line-height:1}.ring span{font-size:12px;color:var(--mut)}
.verdict{font-size:21px;font-weight:700;margin-top:6px}.verdict.p{color:var(--ok)}.verdict.f{color:var(--bad)}
.brk{display:grid;gap:6px;margin-top:14px;text-align:right}
.br{display:grid;grid-template-columns:1fr 2fr auto;gap:10px;align-items:center;font-size:13.5px}
.bar{height:8px;background:var(--line);border-radius:6px;overflow:hidden;direction:ltr}.bar i{display:block;height:100%;background:var(--ok)}
.empty{background:var(--card);border:1px dashed var(--line);border-radius:14px;padding:22px;text-align:center;color:var(--mut)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;padding:20px;z-index:50}
.modal .box{background:var(--card);border-radius:16px;padding:20px;max-width:420px;width:100%}.modal p{color:var(--mut);margin-top:6px;font-size:14px}

 supervisor must be at least 21 and have held a full licence for 3 years.","ex_ar":"يجب أن يكون عمر مرافق المتعلم على الأقل 21 سنة وحاملًا للرخصة الكاملة 3 سنوات.","words":[],"sd":"","ex_sd":"","other":"","id":1300,"en":"Which of these statements is correct?","ar":"أيّ العبارات التالية صحيحة؟ — ما الحد الأدنى لعمر مرافق السائق المتعلم؟","opts":["A learner's supervisor must be at least 21 and have held a full licence for 3 years.","A learner's supervisor must be at least 17.","A learner's supervisor must be at least 18.","A learner's supervisor must be at least 25 with 10 years' experience."],"ans":"A","lv":5,"fmt":"st","level":5,"ch":9},{"cat":"Vehicle","cat_ar":"المركبة","ex_en":"Heavy and uneven tyre wear can be caused by faults in the suspension or steering.","ex_ar":"قد يسبب التآكل الشديد وغير المتساوي أعطال في نظام التعليق أو التوجيه.","words":[],"sd":"","ex_sd":"","other":"","id":1256,"en":"Which of these statements is correct?","ar":"أيّ العبارات التالية صحيحة؟ — ما الذي يسبب تآكل الإطارات الشديد وغير المتساوي؟","opts":["Heavy and uneven tyre wear can be caused by low engine oil.","Heavy and uneven tyre wear can be caused by using the heater.","Heavy and uneven tyre wear can be caused by faults in the suspension or steering.","Heavy and uneven tyre wear can be caused by a full fuel tank."],"ans":"C","lv":5,"fmt":"st","level":5,"ch":6},{"cat":"Road Signs","cat_ar":"إشارات المرور","ex_en":"A \"20 ZONE\" sign means a 20 mph limit applies throughout the zone.","ex_ar":"إشارة \"20 ZONE\" تعني حد 20 ميلًا/ساعة في كامل المنطقة.","words":[],"sd":"","ex_sd":"","other":"","id":1116,"en":"Which of these statements is correct?","ar":"أيّ العبارات التالية صحيحة؟ — ماذا تعني إشارة \"20 ZONE\" بدائرة حمراء؟","opts":["A \"20 ZONE\" sign means minimum speed 20 mph.","A \"20 ZONE\" sign means 20 parking spaces.","A \"20 ZONE\" sign means advisory 20 mph only.","A \"20 ZONE\" sign means a 20 mph limit applies throughout the zone."],"ans":"D","lv":5,"fmt":"st","level":5,"ch":1},{"cat":"Laws","cat_ar":"القوانين","ex_en":"After an injury collision without exchanging details you must report it to the police as soon as possible, within 24 hours.","ex_ar":"بعد حادث بإصابة دون تبادل بيانات يجب إبلاغ الشرطة في أقرب وقت خلال 24 ساعة.","words":[],"sd":"","ex_sd":"","other":"","id":1296,"en":"Which of these statements is correct?","ar":"أيّ العبارات التالية صحيحة؟ — ماذا يجب إذا تعرضت لحادث فيه إصابة ولم تتبادل البيانات في الموقع؟","opts":["After an injury collision without exchanging details you must report it to the police only if asked.","After an injury collision without exchanging details you must report it to the police as soon as possible, within 24 hours.","After an injury collision without exchanging details you must report it to the police within 7 days.","After an injury collision without exchanging details you must report it to the police within a month."],"ans":"B","lv":5,"fmt":"st","level":5,"ch":9},{"cat":"Stopping Distance","cat_ar":"مسافات التوقف","ex_en":"Overall stopping distance = thinking distance + braking distance.","ex_ar":"مسافة التوقف الإجمالية = مسافة التفكير + مسافة الفرملة.","words":[],"sd":"","ex_sd":"","other":"","id":1440,"en":"Which of these statements is correct?","ar":"أيّ العبارات التالية صحيحة؟ — مسافة التوقف الإجمالية تتكون من أي جزأين؟","opts":["Overall stopping distance = gap + thinking time.","Overall stopping distance = speed + reaction time.","Overall stopping distance = thinking distance + braking distance.","Overall stopping distance = braking + tyre grip."],"ans":"C","lv":5,"fmt":"st","level":5,"ch":4}],"mock":[27,18,38,22,24,49,53,44,36,57,37,56,32,23,66,14,9,28,50,46,61,62,21,8,17,55,19,30,48,15,64,2,16,13,47,4,5,34,1,43,11,65,42,54,26,39,3,59,45,35],"chapters":[{"t":"مقدمة اختبار القيادة النظري","en":"About the Theory Test","b":"\n<p class=\"lead\">تؤدي اختبار الـ Theory Test على كمبيوتر في مركز معتمد، ويتكوّن من جزأين يجب أن تنجح فيهما معًا في الجلسة نفسها.</p>\n<table class=\"kv\"><tr><th>البند</th><th>التفاصيل</th></tr><tr><td>الجزء 1: Multiple Choice</td><td>50 سؤالًا · 57 دقيقة · النجاح <b>43 من 50</b></td></tr><tr><td>استراحة</td><td>حتى 3 دقائق بين الجزأين</td></tr><tr><td>الجزء 2: Hazard Perception</td><td>14 مقطع فيديو · 15 خطرًا · النجاح <b>44 من 75</b></td></tr><tr><td>الرسوم</td><td>£23 — يُحجز من gov.uk/book-theory-test</td></tr><tr><td>صلاحية الشهادة</td><td>سنتان من تاريخ النجاح</td></tr><tr><td>شروط الدخول</td><td>رخصة مؤقتة Provisional Licence · عمر 17 (أو 16 لمستحقي PIP)</td></tr></table>\n<div class=\"call warn\"><b>تنبيه</b>احجز من الموقع الحكومي فقط؛ المواقع الوسيطة ترفع الرسوم. وإذا رسبت في أحد الجزأين تعيد الاختبار كاملًا.</div>\n<h3>يوم الامتحان</h3>\n<ol class=\"steps\"><li>أحضر الرخصة المؤقتة الأصلية.</li><li>صل قبل الموعد بـ 15 دقيقة.</li><li>اترك الهاتف خارج القاعة.</li><li>اقرأ السؤال جيدًا قبل الإجابة.</li><li>تظهر النتيجة بعد وقت قصير من انتهاء الاختبار.</li></ol>\n<h3>أنواع الرخص</h3>\n<p><b>Provisional</b> (مؤقتة): تتعلم بها مع لوحة <b>L</b> وسائق مرافق أو مدرب ← <b>Full Licence</b> بعد النجاح في الاختبار العملي.</p>"},{"t":"إشارات المرور البريطانية","en":"Road Signs","b":"\n<p class=\"lead\">القاعدة الذهبية: <b>الشكل واللون يخبرانك بنوع الإشارة</b> قبل أن تقرأ محتواها.</p>\n<div class=\"shapes\">\n<div><svg viewBox=\"0 0 60 60\" width=\"52\" height=\"52\"><circle cx=\"30\" cy=\"30\" r=\"25\" fill=\"#fff\" stroke=\"#C8102E\" stroke-width=\"7\"/><text x=\"30\" y=\"35\" font-size=\"14\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#111\">30</text></svg><b>دائرة بحدود حمراء</b><span>منع / حد — Prohibition</span></div>\n<div><svg viewBox=\"0 0 60 60\" width=\"52\" height=\"52\"><circle cx=\"30\" cy=\"30\" r=\"27\" fill=\"#1D5FB4\"/><path d=\"M38 30 H20 M27 22 l-8 8 8 8\" stroke=\"#fff\" stroke-width=\"4\" fill=\"none\"/></svg><b>دائرة زرقاء</b><span>أمر إلزامي — Mandatory</span></div>\n<div><svg viewBox=\"0 0 60 60\" width=\"52\" height=\"52\"><path d=\"M30 6 L56 52 H4 Z\" fill=\"#fff\" stroke=\"#C8102E\" stroke-width=\"6\" stroke-linejoin=\"round\"/><text x=\"30\" y=\"45\" font-size=\"16\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#111\">!</text></svg><b>مثلث بحدود حمراء</b><span>تحذير — Warning</span></div>\n<div><svg viewBox=\"0 0 60 60\" width=\"52\" height=\"52\"><rect x=\"4\" y=\"12\" width=\"52\" height=\"36\" rx=\"4\" fill=\"#1D5FB4\"/><text x=\"30\" y=\"36\" font-size=\"11\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#fff\">INFO</text></svg><b>مستطيل</b><span>معلومات / إرشاد — Information</span></div></div>\n<h3>إشارات مهمة</h3>\n<div class=\"signs\">\n<div><svg viewBox=\"0 0 60 60\" width=\"52\" height=\"52\"><path d=\"M20 4 H40 L56 20 V40 L40 56 H20 L4 40 V20 Z\" fill=\"#C8102E\"/><text x=\"30\" y=\"35\" font-size=\"12\" font-weight=\"800\" text-anchor=\"middle\" fill=\"#fff\">STOP</text></svg><div class=\"term\"><div class=\"en\">Stop</div><div class=\"ar\">قف</div><div class=\"wh\">متى؟ عند التقاطعات الخطرة · ماذا تفعل؟ توقف كليًا وأعطِ الأولوية.</div></div></div>\n<div><svg viewBox=\"0 0 60 60\" width=\"52\" height=\"52\"><path d=\"M4 8 H56 L30 54 Z\" fill=\"#fff\" stroke=\"#C8102E\" stroke-width=\"6\" stroke-linejoin=\"round\"/></svg><div class=\"term\"><div class=\"en\">Give Way</div><div class=\"ar\">أعطِ الأولوية</div><div class=\"wh\">متى؟ قبل التقاطع أو الدوار · ماذا تفعل؟ أبطئ وتوقف إن لزم.</div></div></div>\n<div><svg viewBox=\"0 0 60 60\" width=\"52\" height=\"52\"><circle cx=\"30\" cy=\"30\" r=\"27\" fill=\"#C8102E\"/><rect x=\"12\" y=\"25\" width=\"36\" height=\"10\" fill=\"#fff\"/></svg><div class=\"term\"><div class=\"en\">No Entry</div><div class=\"ar\">ممنوع الدخول</div><div class=\"wh\">متى؟ مداخل الشوارع أحادية الاتجاه · ماذا تفعل؟ لا تدخل.</div></div></div>\n<div><svg viewBox=\"0 0 60 60\" width=\"52\" height=\"52\"><circle cx=\"30\" cy=\"30\" r=\"25\" fill=\"#fff\" stroke=\"#C8102E\" stroke-width=\"7\"/><text x=\"30\" y=\"35\" font-size=\"14\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#111\">30</text></svg><div class=\"term\"><div class=\"en\">30 mph Limit</div><div class=\"ar\">حد السرعة 30</div><div class=\"wh\">متى؟ داخل المدن · ماذا تفعل؟ لا تتجاوز 30.</div></div></div>\n<div><svg viewBox=\"0 0 60 60\" width=\"52\" height=\"52\"><circle cx=\"30\" cy=\"30\" r=\"26\" fill=\"#fff\" stroke=\"#111\" stroke-width=\"1.5\"/><path d=\"M14 40 L46 20\" stroke=\"#111\" stroke-width=\"7\"/></svg><div class=\"term\"><div class=\"en\">National Speed Limit</div><div class=\"ar\">الحد الوطني للسرعة</div><div class=\"wh\">متى؟ نهاية منطقة سرعة محددة · ماذا تفعل؟ التزم بالحد حسب نوع الطريق.</div></div></div>\n<div><svg viewBox=\"0 0 60 60\" width=\"52\" height=\"52\"><circle cx=\"30\" cy=\"30\" r=\"27\" fill=\"#1D5FB4\"/><path d=\"M38 30 H20 M27 22 l-8 8 8 8\" stroke=\"#fff\" stroke-width=\"4\" fill=\"none\"/></svg><div class=\"term\"><div class=\"en\">Turn left (mandatory)</div><div class=\"ar\">انعطف يسارًا (إلزامي)</div><div class=\"wh\">ماذا تفعل؟ انعطف يسارًا فقط.</div></div></div></div>\n<div class=\"call exam\"><b>سؤال امتحاني متكرر</b>ما معنى الدائرة الحمراء؟ ← منع أو حد. المثلث؟ ← تحذير. الدائرة الزرقاء؟ ← أمر إلزامي.</div>\n<p class=\"note\">الرسوم هنا مبسّطة للتعلّم وليست الرسوم الرسمية. للرسوم الرسمية: Know your traffic signs على gov.uk.</p>"},{"t":"خطوط وعلامات الطريق","en":"Road Markings","b":"\n<div class=\"term\"><div class=\"en\">Double Yellow Lines</div><div class=\"ar\">ممنوع الانتظار في أي وقت ما لم تُبيِّن اللافتات استثناءات.</div></div>\n<div class=\"term\"><div class=\"en\">Single Yellow Line</div><div class=\"ar\">قيود وقوف في أوقات محددة.</div></div>\n<div class=\"term\"><div class=\"en\">Box Junction</div><div class=\"ar\">لا تدخل إلا إذا كان المخرج خاليًا (يُستثنى الانتظار للانعطاف يمينًا).</div></div>\n<div class=\"term\"><div class=\"en\">Zebra / Pelican Crossing</div><div class=\"ar\">أعطِ المشاة الأولوية.</div></div>\n<div class=\"term\"><div class=\"en\">Bus Lane</div><div class=\"ar\">مسار مخصص للحافلات حسب اللافتات.</div></div>\n<div class=\"term\"><div class=\"en\">Cycle Lane</div><div class=\"ar\">مسار الدراجات.</div></div>\n<h3>الخطوط البيضاء</h3>\n<table class=\"\"><tr><th>النوع</th><th>المعنى</th></tr><tr><td>خط متقطع</td><td>يمكن العبور بحذر</td></tr><tr><td>خط متصل</td><td>لا تعبر عادةً</td></tr><tr><td>خطان في وسط الطريق</td><td>إذا كان الأقرب إليك متصلًا = لا تتجاوز</td></tr><tr><td>خط أبيض متقطع قصير</td><td>خط تحذير: خطر أمامك</td></tr></table>"},{"t":"قواعد الطريق والأولوية","en":"Rules & Priority","b":"\n<div class=\"term\"><div class=\"en\">Junction — التقاطع</div><div class=\"ar\">اتبع اللافتات وأعطِ الأولوية.</div></div>\n<div class=\"term\"><div class=\"en\">Roundabout — الدوار</div><div class=\"ar\">الأولوية للقادم من اليمين.</div></div>\n<div class=\"term\"><div class=\"en\">Overtaking — التجاوز</div><div class=\"ar\">لا تتجاوز مع ضعف الرؤية.</div></div>\n<div class=\"term\"><div class=\"en\">Emergency vehicles — مركبات الطوارئ</div><div class=\"ar\">افسح الطريق بأمان.</div></div>\n<div class=\"big\"><span>MSM</span><div><b>Mirror ← Signal ← Manoeuvre</b>مرآة، ثم إشارة، ثم حركة — قبل أي حركة.</div></div>\n<div class=\"call note\"><b>ملاحظة</b>تحديث Highway Code 2022: للمشاة أولوية عند التقاطعات، واترك 1.5 متر على الأقل عند تجاوز راكبي الدراجات.</div>"},{"t":"السرعة ومسافات التوقف","en":"Speed & Stopping Distances","b":"\n<h3>حدود السرعة للسيارات</h3>\n<table class=\"kv\"><tr><th>المكان</th><th>الحد</th></tr><tr><td>المناطق العمرانية</td><td>30 mph</td></tr><tr><td>الطريق المفرد</td><td>60 mph</td></tr><tr><td>الطريق المزدوج / الموتروي</td><td>70 mph</td></tr><tr><td>قرب المدارس (غالبًا)</td><td>20 mph</td></tr></table>\n<h3>مسافات التوقف</h3>\n<table class=\"num\"><tr><th>السرعة</th><th>مسافة التفكير</th><th>مسافة الفرملة</th><th>الإجمالي</th></tr><tr><td><b>20 mph</b></td><td>6 م</td><td>6 م</td><td><b>12 م</b></td></tr><tr><td><b>30 mph</b></td><td>9 م</td><td>14 م</td><td><b>23 م</b></td></tr><tr><td><b>40 mph</b></td><td>12 م</td><td>24 م</td><td><b>36 م</b></td></tr><tr><td><b>50 mph</b></td><td>15 م</td><td>38 م</td><td><b>53 م</b></td></tr><tr><td><b>60 mph</b></td><td>18 م</td><td>55 م</td><td><b>73 م</b></td></tr><tr><td><b>70 mph</b></td><td>21 م</td><td>75 م</td><td><b>96 م</b></td></tr></table>\n<div class=\"call exam\"><b>سؤال امتحاني متكرر</b>احفظ الإجماليات: 12 · 23 · 36 · 53 · 73 · 96 متر — تتكرر كثيرًا في الامتحان.</div>\n<div class=\"big\"><span>2s</span><div><b>قاعدة الثانيتين</b>على الطريق الجاف. في المطر 4 ثوانٍ، وعلى الجليد قد تزيد المسافة حتى 10 أضعاف.</div></div>"},{"t":"القيادة في الظروف الجوية","en":"Weather","b":"\n<div class=\"term\"><div class=\"en\">Rain — المطر</div><div class=\"ar\">زد المسافة وخفف السرعة.</div></div>\n<div class=\"term\"><div class=\"en\">Fog — الضباب</div><div class=\"ar\">استخدم أضواء الضباب فقط عند ضعف الرؤية.</div></div>\n<div class=\"term\"><div class=\"en\">Aquaplaning — الانزلاق المائي</div><div class=\"ar\">ارفع قدمك عن دواسة الوقود تدريجيًا.</div></div>\n<div class=\"term\"><div class=\"en\">Ice and Snow — الجليد والثلج</div><div class=\"ar\">تجنّب الحركات المفاجئة.</div></div>\n<div class=\"term\"><div class=\"en\">Strong Wind — الرياح القوية</div><div class=\"ar\">ثبّت المقود.</div></div>"},{"t":"سلامة المركبة والصيانة","en":"Vehicle Safety","b":"\n<table class=\"kv\"><tr><th>الجزء</th><th>ماذا تفحص؟</th></tr><tr><td>الإطارات</td><td>الضغط (وهي باردة) · عمق النقش 1.6 مم على الأقل</td></tr><tr><td>الفرامل</td><td>دواسة صلبة، بلا صوت غريب</td></tr><tr><td>الأضواء</td><td>كلها تعمل</td></tr><tr><td>المرايا</td><td>نظيفة ومضبوطة</td></tr><tr><td>حزام الأمان</td><td>الجميع يربطه</td></tr><tr><td>MOT</td><td>أول فحص بعد 3 سنوات</td></tr></table>\n<div class=\"call warn\"><b>تنبيه</b>ضوء أحمر في لوحة العدادات = توقف بأمان وافحص.</div>"},{"t":"اكتشاف المخاطر","en":"Hazard Perception","b":"\n<div class=\"term\"><div class=\"en\">Developing Hazard — الخطر المتطور</div><div class=\"ar\">خطر يتطور ويحتاج منك إجراءً.</div></div>\n<table class=\"kv\"><tr><th>النصيحة</th><th>التفاصيل</th></tr><tr><td>متى تنقر؟</td><td>أول ما يبدأ الخط   app.innerHTML = `<div class="qbar"><b>${i + 1}. ${c.t}</b><span style="flex:1"></span><button class="btn ghost" id="bk">كل الأبواب</button></div>${note}<div class="read">${c.b}</div>
  <div class="nav"><button class="btn ghost" id="pv" ${i === 0 ? 'disabled' : ''}>الباب السابق</button>${i < DATA.chapters.length - 1 ? '<button class="btn" id="nx">الباب التالي</button>' : ''}</div>`;
  $('#bk').onclick = guideList; $('#pv').onclick = () => readCh(i - 1); if ($('#nx')) $('#nx').onclick = () => readCh(i + 1); scrollTo(0, 0);
}
/* ===== SIGNS ===== */
function signs() {
  app.innerHTML = `<h2 class="pt">إشارات المرور</h2><p class="sub">الشكل واللون يخبرانك بنوع الإشارة: الدائرة الحمراء منع، والزرقاء أمر، والمثلث تحذير، والمستطيل معلومات.</p>
  <div class="nav"><button class="btn red" id="sq">اختبر نفسك في الإشارات</button></div>
  <div class="sec-t">كل الإشارات</div><div class="sg">${DATA.signs.map(s => `<div class="sgc">${s.svg.replace('width="52" height="52"', 'width="72" height="72"')}<b class="en">${s.en}</b><span>${s.ar}</span></div>`).join('')}</div>`;
  $('#sq').onclick = () => signQuiz(shuffle(DATA.signs.map((_, i) => i)), 0, 0);
}
function signQuiz(order, k, score) {
  if (k >= order.length) { app.innerHTML = `<div class="res"><div class="ring" style="background:conic-gradient(var(--ok) ${score / order.length * 100}%,var(--line) 0)"><div><b class="en">${score}/${order.length}</b></div></div><div class="verdict p">انتهى اختبار الإشارات</div><div class="nav" style="justify-content:center"><button class="btn red" id="ag">مرة أخرى</button><button class="btn ghost" id="bk">رجوع</button></div></div>`;
    $('#ag').onclick = () => signQuiz(shuffle(order), 0, 0); $('#bk').onclick = () => go('signs', true); return; }
  const i = order[k], s = DATA.signs[i], opts = shuffle([i, ...shuffle(DATA.signs.map((_, j) => j).filter(j => j !== i)).slice(0, 3)]);
  app.innerHTML = `<div class="qbar"><b>اختبار الإشارات</b><div class="prog"><i style="width:${k / order.length * 100}%"></i></div><span class="en">${k + 1}/${order.length}</span></div>
  <div class="qcard"><div class="qar" style="margin:0">ماذا تعني هذه الإشارة؟</div><div class="sgq">${s.svg.replace('width="52" height="52"', '')}</div><div class="sgo">${opts.map(j => `<button class="opt" data-j="${j}" style="direction:rtl;text-align:right"><span>${DATA.signs[j].ar}</span></button>`).join('')}</div><div id="sfb"></div></div>`;
  app.querySelectorAll('[data-j]').forEach(b => b.onclick = () => {
    const ok = +b.dataset.j === i; if (ok) { score++; st.sg[i] = 1; save(); }
    app.querySelectorAll('[data-j]').forEach(x => { x.disabled = true; if (+x.dataset.j === i) x.classList.add('ok'); else if (x === b) x.classList.add('bad'); });
    $('#sfb').innerHTML = `<div class="fb ${ok ? '' : 'no'}"><b>${ok ? 'صحيح ✓' : 'خطأ'}</b><p><span class="en">${s.en}</span> — ${L(s.ar, s.en_m)}. ${L(s.when, s.when_en)}.</p></div><div class="nav"><button class="btn" id="nx">التالي</button></div>`;
    $('#nx').onclick = () => signQuiz(order, k + 1, score);
  });
}
